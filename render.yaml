services:
  - type: web
    name: darglobal-applied-ai-chatbot
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: ENABLE_DENSE_QUERY
        value: "false"
      - key: REFRESH_SOURCES_ON_START
        value: "false"