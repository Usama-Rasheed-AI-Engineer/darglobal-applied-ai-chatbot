services:
  - type: web
    name: darglobal-applied-ai-chatbot
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-oss-20b:free
      - key: REFRESH_SOURCES_ON_START
        value: "false"
      - key: JINA_API_KEY
        sync: false
      - key: SCRAPERAPI_KEY
        sync: false
      - key: SCRAPE_MAX_DARGLOBAL
        value: "500"
      - key: SCRAPE_MAX_WASALT
        value: "1000"
