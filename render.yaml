services:
  - type: web
    name: darglobal-applied-ai-chatbot
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-oss-20b:free
      - key: REFRESH_SOURCES_ON_START
        value: "true"
