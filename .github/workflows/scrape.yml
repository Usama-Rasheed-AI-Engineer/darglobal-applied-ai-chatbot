name: Refresh public property data

on:
  workflow_dispatch:
  repository_dispatch:
    types: [scrape-sources]
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  refresh-darglobal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawl DarGlobal sitemap
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPE_SOURCE: "DarGlobal"
          SCRAPE_MAX_DARGLOBAL: "500"
          SCRAPE_REQUEST_DELAY: "0"
        run: python -m scraper.scrape

      - name: Upload DarGlobal source data
        uses: actions/upload-artifact@v4
        with:
          name: darglobal-source-data
          path: data

  refresh-wasalt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawl Wasalt sitemap
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPE_SOURCE: "Wasalt"
          SCRAPE_MAX_WASALT: "1000"
          SCRAPE_REQUEST_DELAY: "0"
        run: python -m scraper.scrape

      - name: Upload Wasalt source data
        uses: actions/upload-artifact@v4
        with:
          name: wasalt-source-data
          path: data

  commit:
    needs: [refresh-darglobal, refresh-wasalt]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge source databases
        run: python - <<'PY'
import json
from pathlib import Path

output = Path("data/public_sources.json")
combined = []
if output.exists():
    combined.extend(json.loads(output.read_text(encoding="utf-8")))

for file in Path("artifacts").glob("*/public_sources.json"):
    combined.extend(json.loads(file.read_text(encoding="utf-8")))

deduplicated = []
seen = set()
for row in combined:
    key = (row.get("url", ""), row.get("text", "")[:300])
    if key not in seen:
        seen.add(key)
        deduplicated.append(row)
output.parent.mkdir(parents=True, exist_ok=True)
output.write_text(json.dumps(deduplicated, indent=2, ensure_ascii=False), encoding="utf-8")

manifest = []
for file in Path("artifacts").glob("*/source_manifest.json"):
    manifest.extend(json.loads(file.read_text(encoding="utf-8")))
Path("data/source_manifest.json").write_text(
    json.dumps(manifest, indent=2, ensure_ascii=False),
    encoding="utf-8",
)
print(f"Merged {len(deduplicated)} source rows")
PY
      - name: Commit source database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public_sources.json data/source_manifest.json
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git diff --cached --stat
            git commit -m "Refresh public property source data"
            git push
          fi
